<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JSON Attribute Editor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b70;
    --border: #dcdce0;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --danger: #b3261e;
    --ok: #1a7f37;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --card: #1c1c1f;
      --text: #f0f0f2;
      --muted: #9a9aa2;
      --border: #333338;
      --accent: #3b82f6;
      --accent-text: #0a0a0a;
      --danger: #ff6b64;
      --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
    max-width: 640px;
    margin-inline: auto;
    padding-bottom: 80px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 0.92rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 12px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    font-size: 1rem;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .file-drop {
    display: block;
    width: 100%;
    padding: 18px;
    text-align: center;
    border: 2px dashed var(--border);
    border-radius: 12px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.95rem;
  }
  .file-drop.has-file {
    border-color: var(--ok);
    color: var(--text);
  }
  input[type="file"] { display: none; }
  button {
    width: 100%;
    font-size: 1rem;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    margin-top: 6px;
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .match-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .match-item {
    text-align: left;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .match-item.selected {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
  }
  .match-path {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.75rem;
    display: block;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .attr-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .attr-row:last-child { border-bottom: none; }
  .attr-row label {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    font-size: 0.95rem;
    margin: 0;
  }
  .attr-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
  }
  .attr-value {
    font-family: var(--mono);
    color: var(--muted);
    font-size: 0.85rem;
  }
  .attr-value.new {
    color: var(--ok);
    font-weight: 700;
  }
  .money-input {
    width: 120px;
    text-align: right;
    font-family: var(--mono);
    font-size: 0.9rem;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 0.8rem;
    max-height: 320px;
  }
  .status {
    font-size: 0.88rem;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .status.error {
    background: color-mix(in srgb, var(--danger) 15%, transparent);
    color: var(--danger);
  }
  .status.ok {
    background: color-mix(in srgb, var(--ok) 15%, transparent);
    color: var(--ok);
  }
  .hidden { display: none !important; }
  .filename {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
    word-break: break-all;
  }
</style>
</head>
<body>

<h1>JSON Attribute Editor</h1>
<p class="subtitle">Load a JSON file, find an item by name, set its attributes to 20, export the result. Everything stays on your device.</p>

<div class="status error hidden" id="globalError"></div>

<div class="card">
  <h2>1. Load file</h2>
  <label class="file-drop" id="fileDrop" for="fileInput" tabindex="0">Tap to choose a .json file</label>
  <input type="file" id="fileInput" accept=".json,application/json">
  <div class="filename" id="fileName"></div>
  <div class="status hidden" id="fileStatus"></div>
</div>

<div class="card hidden" id="searchCard">
  <h2>2. Find item by name</h2>
  <label for="nameInput">Name to search for</label>
  <input type="text" id="nameInput" placeholder="e.g. Goku, Player1, Sword...">
  <button id="findBtn">Find</button>
  <div id="searchStatus"></div>
</div>

<div class="card hidden" id="matchesCard">
  <h2>3. Pick the match</h2>
  <div class="match-list" id="matchList"></div>
</div>

<div class="card hidden" id="attrsCard">
  <h2>4. Attributes to set to 20</h2>
  <div id="attrList"></div>
  <div class="attr-row hidden" id="moneyRow">
    <label><input type="checkbox" id="moneyCheckbox" checked> <span id="moneyKeyLabel"></span></label>
    <input type="text" inputmode="numeric" id="moneyInput" class="money-input">
  </div>
  <button id="applyBtn">Apply changes</button>
</div>

<div class="card hidden" id="exportCard">
  <h2>5. Export</h2>
  <div class="status ok" id="applyStatus"></div>
  <pre id="jsonPreview"></pre>
  <button id="downloadBtn">Download .json</button>
  <button class="secondary" id="copyBtn">Copy JSON to clipboard</button>
  <div class="status hidden" id="copyStatus"></div>
  <button class="secondary" id="startOverBtn">Start over</button>
</div>

<script>
(function () {
  'use strict';

  window.addEventListener('error', function (e) {
    var el = document.getElementById('globalError');
    el.classList.remove('hidden');
    el.textContent = 'Something went wrong: ' + (e.message || 'unknown error') + '. Try reloading the page.';
  });

  var state = {
    data: null,
    originalName: 'data',
    matches: [],       // [{ path: [...keys], obj: reference }]
    selectedIndex: -1,
    attrKeys: [],       // keys within the chosen attribute container
    attrContainer: null, // the object whose keys get set to 20 (may be the item itself or a nested sub-object)
    moneyField: null   // { container, key } for a detected money-like field, or null
  };

  var fileInput = document.getElementById('fileInput');
  var fileDrop = document.getElementById('fileDrop');
  var fileName = document.getElementById('fileName');
  var searchCard = document.getElementById('searchCard');
  var nameInput = document.getElementById('nameInput');
  var findBtn = document.getElementById('findBtn');
  var searchStatus = document.getElementById('searchStatus');
  var matchesCard = document.getElementById('matchesCard');
  var matchList = document.getElementById('matchList');
  var attrsCard = document.getElementById('attrsCard');
  var attrList = document.getElementById('attrList');
  var moneyRow = document.getElementById('moneyRow');
  var moneyCheckbox = document.getElementById('moneyCheckbox');
  var moneyKeyLabel = document.getElementById('moneyKeyLabel');
  var moneyInput = document.getElementById('moneyInput');
  var applyBtn = document.getElementById('applyBtn');
  var exportCard = document.getElementById('exportCard');
  var applyStatus = document.getElementById('applyStatus');
  var jsonPreview = document.getElementById('jsonPreview');
  var fileStatus = document.getElementById('fileStatus');
  var downloadBtn = document.getElementById('downloadBtn');
  var copyBtn = document.getElementById('copyBtn');
  var copyStatus = document.getElementById('copyStatus');
  var startOverBtn = document.getElementById('startOverBtn');

  var IDENTIFYING_KEYS = ['name', 'id', 'title', 'label'];
  var ATTRIBUTE_CONTAINER_KEYS = ['attributes', 'stats', 'attrs'];
  var NAME_PART_PAIRS = [
    ['firstName', 'lastName'],
    ['first_name', 'last_name'],
    ['first', 'last'],
    ['givenName', 'familyName']
  ];

  function resetAfterFile() {
    state.matches = [];
    state.selectedIndex = -1;
    state.attrKeys = [];
    state.attrContainer = null;
    state.moneyField = null;
    matchesCard.classList.add('hidden');
    attrsCard.classList.add('hidden');
    exportCard.classList.add('hidden');
    matchList.innerHTML = '';
    attrList.innerHTML = '';
    moneyRow.classList.add('hidden');
    searchStatus.innerHTML = '';
  }

  fileDrop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fileInput.click();
    }
  });

  function showFileError(message) {
    fileDrop.classList.remove('has-file');
    fileDrop.textContent = 'Tap to choose a .json file';
    fileName.textContent = '';
    searchCard.classList.add('hidden');
    fileStatus.className = 'status error';
    fileStatus.textContent = message;
  }

  fileInput.addEventListener('change', function () {
    var file = fileInput.files[0];
    if (!file) return;

    fileStatus.className = 'status hidden';
    fileStatus.textContent = '';

    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e) {
        showFileError('That file is not valid JSON: ' + e.message);
        return;
      }
      state.data = parsed;
      state.originalName = file.name.replace(/\.json$/i, '') || 'data';
      fileDrop.classList.add('has-file');
      fileDrop.textContent = 'File loaded ✓ (tap to replace)';
      fileName.textContent = file.name;
      searchCard.classList.remove('hidden');
      resetAfterFile();
      nameInput.value = '';
      nameInput.focus();
    };
    reader.onerror = function () {
      showFileError('Could not read that file (' + (reader.error ? reader.error.message : 'unknown error') + '). Please try again.');
    };
    try {
      reader.readAsText(file);
    } catch (e) {
      showFileError('Could not read that file: ' + e.message);
    }
  });

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  function isNumeric(v) {
    return typeof v === 'number' && !Number.isNaN(v);
  }

  // Recursively walk the tree, collecting every plain object that has a
  // string/number-valued property matching `name` (case-insensitive).
  function findMatches(root, name) {
    var needle = String(name).trim().toLowerCase();
    var results = [];
    var seen = new Set();

    function visit(node, path) {
      if (Array.isArray(node)) {
        node.forEach(function (child, i) { visit(child, path.concat(i)); });
        return;
      }
      if (!isPlainObject(node)) return;

      var matchedKey = null;
      // Prefer identifying keys first.
      for (var i = 0; i < IDENTIFYING_KEYS.length; i++) {
        var k = IDENTIFYING_KEYS[i];
        if (k in node && String(node[k]).toLowerCase() === needle) {
          matchedKey = k;
          break;
        }
      }
      // Then try common "First Last" name-part pairs (e.g. firstName + lastName).
      if (!matchedKey) {
        for (var p = 0; p < NAME_PART_PAIRS.length; p++) {
          var pair = NAME_PART_PAIRS[p];
          var first = pair[0], last = pair[1];
          if (typeof node[first] === 'string' && typeof node[last] === 'string') {
            var full = (node[first] + ' ' + node[last]).toLowerCase();
            if (full === needle) {
              matchedKey = first + ' + ' + last;
              break;
            }
          }
        }
      }
      // Fall back to any string/number field matching.
      if (!matchedKey) {
        for (var key in node) {
          if (!Object.prototype.hasOwnProperty.call(node, key)) continue;
          var val = node[key];
          if ((typeof val === 'string' || typeof val === 'number') &&
              String(val).toLowerCase() === needle) {
            matchedKey = key;
            break;
          }
        }
      }

      if (matchedKey && !seen.has(node)) {
        seen.add(node);
        results.push({ path: path, obj: node, matchedKey: matchedKey });
      }

      for (var childKey in node) {
        if (!Object.prototype.hasOwnProperty.call(node, childKey)) continue;
        visit(node[childKey], path.concat(childKey));
      }
    }

    visit(root, []);
    return results;
  }

  function pathToString(path) {
    if (path.length === 0) return '(root)';
    return path.map(function (p) {
      return typeof p === 'number' ? '[' + p + ']' : p;
    }).join(' › ');
  }

  findBtn.addEventListener('click', function () {
    var name = nameInput.value.trim();
    matchesCard.classList.add('hidden');
    attrsCard.classList.add('hidden');
    exportCard.classList.add('hidden');
    matchList.innerHTML = '';
    attrList.innerHTML = '';

    if (!name) {
      searchStatus.innerHTML = '<div class="status error">Type a name to search for.</div>';
      return;
    }
    if (!state.data) {
      searchStatus.innerHTML = '<div class="status error">Load a file first.</div>';
      return;
    }

    var matches = findMatches(state.data, name);
    state.matches = matches;

    if (matches.length === 0) {
      searchStatus.innerHTML = '<div class="status error">No item found matching "' + escapeHtml(name) + '".</div>';
      return;
    }

    searchStatus.innerHTML = '<div class="status ok">Found ' + matches.length + ' match' + (matches.length > 1 ? 'es' : '') + '.</div>';

    if (matches.length === 1) {
      selectMatch(0);
    } else {
      renderMatchList();
      matchesCard.classList.remove('hidden');
    }
  });

  function matchedValueDisplay(obj, matchedKey) {
    if (matchedKey.indexOf(' + ') !== -1) {
      var parts = matchedKey.split(' + ');
      return parts.map(function (k) { return obj[k]; }).join(' ');
    }
    return String(obj[matchedKey]);
  }

  function renderMatchList() {
    matchList.innerHTML = '';
    state.matches.forEach(function (m, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'match-item';
      var snippetKeys = Object.keys(m.obj).slice(0, 4).join(', ');
      btn.innerHTML = '<span class="match-path">' + escapeHtml(pathToString(m.path)) + '</span>' +
        escapeHtml(m.matchedKey) + ': ' + escapeHtml(matchedValueDisplay(m.obj, m.matchedKey)) +
        ' <span class="attr-value">{' + escapeHtml(snippetKeys) + (Object.keys(m.obj).length > 4 ? ', …' : '') + '}</span>';
      btn.addEventListener('click', function () { selectMatch(i); });
      matchList.appendChild(btn);
    });
  }

  function selectMatch(index) {
    state.selectedIndex = index;
    Array.prototype.forEach.call(matchList.children, function (child, i) {
      child.classList.toggle('selected', i === index);
    });
    matchesCard.classList.remove('hidden');
    renderAttrs();
  }

  // Decide which object's keys are "the attributes": a nested attributes/stats
  // sub-object if one exists, otherwise the item's own numeric fields.
  function pickAttributeContainer(obj, identifyingKey) {
    for (var i = 0; i < ATTRIBUTE_CONTAINER_KEYS.length; i++) {
      var key = ATTRIBUTE_CONTAINER_KEYS[i];
      if (isPlainObject(obj[key])) {
        var numericKeys = Object.keys(obj[key]).filter(function (k) { return isNumeric(obj[key][k]); });
        if (numericKeys.length > 0) {
          return { container: obj[key], keys: numericKeys };
        }
      }
    }
    var excludedKeys = identifyingKey.indexOf(' + ') !== -1 ? identifyingKey.split(' + ') : [identifyingKey];
    var ownKeys = Object.keys(obj).filter(function (k) {
      return excludedKeys.indexOf(k) === -1 && isNumeric(obj[k]);
    });
    return { container: obj, keys: ownKeys };
  }

  var MONEY_KEY_PATTERN = /money|coin|cash|gold/i;

  // Breadth-first search (shallowest match wins) through the matched item's
  // own sub-objects for a numeric field that looks like in-game currency.
  function findMoneyField(obj, identifyingKey) {
    var excludedKeys = identifyingKey.indexOf(' + ') !== -1 ? identifyingKey.split(' + ') : [identifyingKey];
    var visited = new Set();
    var queue = [obj];
    while (queue.length) {
      var node = queue.shift();
      if (!isPlainObject(node) || visited.has(node)) continue;
      visited.add(node);
      var keys = Object.keys(node);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        if (node === obj && excludedKeys.indexOf(k) !== -1) continue;
        if (isNumeric(node[k]) && MONEY_KEY_PATTERN.test(k)) {
          return { container: node, key: k };
        }
      }
      for (var j = 0; j < keys.length; j++) {
        if (isPlainObject(node[keys[j]])) queue.push(node[keys[j]]);
      }
    }
    return null;
  }

  function renderAttrs() {
    var match = state.matches[state.selectedIndex];
    var picked = pickAttributeContainer(match.obj, match.matchedKey);
    state.attrContainer = picked.container;
    state.attrKeys = picked.keys;
    state.moneyField = findMoneyField(match.obj, match.matchedKey);

    attrList.innerHTML = '';
    picked.keys.forEach(function (key) {
      var row = document.createElement('div');
      row.className = 'attr-row';
      var currentVal = picked.container[key];
      row.innerHTML =
        '<label><input type="checkbox" checked data-key="' + escapeHtml(key) + '"> ' + escapeHtml(key) + '</label>' +
        '<span class="attr-value">' + currentVal + ' → <span class="new">20</span></span>';
      attrList.appendChild(row);
    });

    if (state.moneyField) {
      moneyRow.classList.remove('hidden');
      moneyKeyLabel.textContent = state.moneyField.key;
      moneyCheckbox.checked = true;
      moneyInput.value = state.moneyField.container[state.moneyField.key];
    } else {
      moneyRow.classList.add('hidden');
    }

    if (picked.keys.length === 0 && !state.moneyField) {
      attrList.innerHTML = '<div class="status error">No numeric attributes found on this item.</div>';
      applyBtn.disabled = true;
    } else {
      applyBtn.disabled = false;
    }

    attrsCard.classList.remove('hidden');
    exportCard.classList.add('hidden');
  }

  applyBtn.addEventListener('click', function () {
    var checkboxes = attrList.querySelectorAll('input[type="checkbox"]');
    var changes = [];
    checkboxes.forEach(function (cb) {
      if (cb.checked) {
        var key = cb.getAttribute('data-key');
        state.attrContainer[key] = 20;
        changes.push(key + ' → 20');
      }
    });

    var moneyInvalid = false;
    if (state.moneyField && moneyCheckbox.checked) {
      var raw = moneyInput.value.replace(/,/g, '').trim();
      var num = Number(raw);
      if (raw !== '' && Number.isFinite(num)) {
        state.moneyField.container[state.moneyField.key] = num;
        changes.push(state.moneyField.key + ' → ' + num);
      } else {
        moneyInvalid = true;
      }
    }

    if (changes.length === 0) {
      applyStatus.className = 'status error';
      applyStatus.textContent = moneyInvalid
        ? 'Enter a valid number for ' + state.moneyField.key + '.'
        : 'Nothing selected — nothing changed.';
    } else {
      applyStatus.className = 'status ok';
      applyStatus.textContent = 'Set ' + changes.join(', ') +
        (moneyInvalid ? ' (' + state.moneyField.key + ' left unchanged — enter a valid number)' : '') + '.';
    }

    jsonPreview.textContent = JSON.stringify(state.data, null, 2);
    exportCard.classList.remove('hidden');
    exportCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function isEmbedded() {
    try { return window.self !== window.top; } catch (e) { return true; }
  }

  // A plain top-level page can just download in place. But embedded/sandboxed
  // views (e.g. this page shown inside another site) often silently block a
  // programmatic <a download> click, so there we instead try, in order: the
  // native share sheet (best on mobile), then a real download link opened in
  // a fresh top-level tab (escapes the sandbox), then the in-place click as a
  // last resort.
  function triggerDownload(jsonStr, filename) {
    var blob = new Blob([jsonStr], { type: 'application/json' });

    if (!isEmbedded()) {
      var directUrl = URL.createObjectURL(blob);
      var directA = document.createElement('a');
      directA.href = directUrl;
      directA.download = filename;
      document.body.appendChild(directA);
      directA.click();
      document.body.removeChild(directA);
      setTimeout(function () { URL.revokeObjectURL(directUrl); }, 2000);
      return;
    }

    if (navigator.canShare && window.File) {
      try {
        var file = new File([blob], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file] }).catch(function () {});
          return;
        }
      } catch (e) { /* fall through to next method */ }
    }

    var scriptSafeJson = JSON.stringify(jsonStr).replace(/<\/script/gi, '<\\/script');
    var pageHtml = '<!doctype html><html><head><meta charset="utf-8"><title>' + escapeHtml(filename) + '</title></head>' +
      '<body style="font-family:-apple-system,sans-serif;padding:24px;max-width:640px;margin:0 auto;">' +
      '<p>Tap the button to save the file. If it doesn’t save automatically, select all the text below and copy it instead.</p>' +
      '<p><a id="dl" download="' + escapeHtml(filename) + '" href="#" ' +
      'style="display:inline-block;padding:14px 20px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none;font-weight:600;">Download ' +
      escapeHtml(filename) + '</a></p>' +
      '<textarea readonly style="width:100%;height:60vh;font-family:monospace;font-size:12px;box-sizing:border-box;" onclick="this.select()">' +
      escapeHtml(jsonStr) + '</textarea>' +
      '<script>var blob=new Blob([' + scriptSafeJson + '],{type:"application/json"});' +
      'document.getElementById("dl").href=URL.createObjectURL(blob);</' + 'script>' +
      '</body></html>';

    var opened = null;
    try {
      var htmlUrl = URL.createObjectURL(new Blob([pageHtml], { type: 'text/html' }));
      opened = window.open(htmlUrl, '_blank');
    } catch (e) { opened = null; }

    if (!opened) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }
  }

  downloadBtn.addEventListener('click', function () {
    triggerDownload(JSON.stringify(state.data, null, 2), state.originalName + '-edited.json');
  });

  copyBtn.addEventListener('click', function () {
    var jsonStr = JSON.stringify(state.data, null, 2);
    var showResult = function (ok) {
      copyStatus.className = 'status ' + (ok ? 'ok' : 'error');
      copyStatus.textContent = ok
        ? 'Copied to clipboard.'
        : 'Could not copy automatically — tap inside the box above, select all, and copy manually.';
    };
    var execCommandFallback = function () {
      var ta = document.createElement('textarea');
      ta.value = jsonStr;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      showResult(ok);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(jsonStr).then(function () { showResult(true); }).catch(execCommandFallback);
    } else {
      execCommandFallback();
    }
  });

  startOverBtn.addEventListener('click', function () {
    fileInput.value = '';
    state.data = null;
    fileDrop.classList.remove('has-file');
    fileDrop.textContent = 'Tap to choose a .json file';
    fileName.textContent = '';
    searchCard.classList.add('hidden');
    resetAfterFile();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') findBtn.click();
  });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>

</body>
</html>
